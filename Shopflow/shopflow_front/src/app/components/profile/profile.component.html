<div class="max-w-4xl mx-auto px-4 py-10">
      
      <!-- Header -->
      <div class="mb-10 animate-fade-in">
        <h1 class="text-4xl font-heading font-black text-slate-900 mb-2 tracking-tight">Mon Profil</h1>
        <p class="text-slate-500 font-medium italic">Gérez vos informations personnelles et préférences.</p>
      </div>

      <!-- États -->
      <div *ngIf="loading()" class="flex flex-col items-center justify-center py-20 bg-white/50 rounded-[40px] border border-dashed border-slate-200">
        <div class="animate-spin text-shopflow-primary mb-4">
          <mat-icon class="text-4xl w-10 h-10">autorenew</mat-icon>
        </div>
        <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Chargement du profil...</p>
      </div>

      <div *ngIf="error()" class="bg-red-50 border border-red-100 text-red-600 p-6 rounded-3xl mb-8 flex items-center gap-4">
        <mat-icon>error_outline</mat-icon>
        <span class="font-medium">{{ error() }}</span>
      </div>

      <div *ngIf="success()" class="bg-emerald-50 border border-emerald-100 text-emerald-600 p-6 rounded-3xl mb-8 flex items-center gap-4 animate-fade-in">
        <mat-icon>check_circle_outline</mat-icon>
        <span class="font-medium">Profil mis à jour avec succès !</span>
      </div>

      <!-- Formulaire -->
      <div *ngIf="!loading() && user()" class="bg-white rounded-[40px] p-8 md:p-12 border border-slate-100 shadow-xl relative overflow-hidden">
        
        <!-- Déco Blob -->
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-shopflow-primary/5 rounded-full blur-3xl"></div>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="relative z-10 space-y-8">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Prénom -->
            <div class="space-y-2">
              <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-4">Prénom</label>
              <div class="relative group">
                <mat-icon class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-shopflow-primary transition-colors">person_outline</mat-icon>
                <input type="text" formControlName="firstName" 
                  class="w-full pl-12 pr-6 py-4 bg-slate-50/50 border-2 border-slate-100 rounded-3xl focus:border-shopflow-primary focus:bg-white outline-none transition-all font-medium text-slate-800">
              </div>
            </div>

            <!-- Nom -->
            <div class="space-y-2">
              <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-4">Nom</label>
              <div class="relative group">
                <mat-icon class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-shopflow-primary transition-colors">badge</mat-icon>
                <input type="text" formControlName="lastName" 
                  class="w-full pl-12 pr-6 py-4 bg-slate-50/50 border-2 border-slate-100 rounded-3xl focus:border-shopflow-primary focus:bg-white outline-none transition-all font-medium text-slate-800">
              </div>
            </div>

            <!-- Email (Read-only for now) -->
            <div class="space-y-2 md:col-span-2 opacity-70">
              <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-4">Email (Identifiant)</label>
              <div class="relative">
                <mat-icon class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300">mail_outline</mat-icon>
                <input type="email" [value]="user()?.email" disabled 
                  class="w-full pl-12 pr-6 py-4 bg-slate-100 border-2 border-slate-100 rounded-3xl font-medium text-slate-500 cursor-not-allowed">
              </div>
            </div>

            <!-- Rôle Badge -->
            <div class="md:col-span-2 pt-2">
              <div class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-2xl">
                <mat-icon class="!text-sm">verified</mat-icon>
                <span class="text-[10px] font-black uppercase tracking-widest">{{ user()?.role }}</span>
              </div>
            </div>

          </div>

          <div class="pt-6 border-t border-slate-50 flex justify-end">
            <button type="submit" [disabled]="profileForm.invalid || saving()"
              class="px-10 py-4 bg-slate-900 text-white rounded-[24px] font-black uppercase tracking-[0.2em] shadow-xl hover:bg-shopflow-primary hover:-translate-y-1 active:scale-95 transition-all disabled:opacity-30 disabled:translate-y-0">
              <span *ngIf="!saving()">Enregistrer les modifications</span>
              <div *ngIf="saving()" class="flex items-center gap-3">
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Mise à jour...</span>
              </div>
            </button>
          </div>

        </form>
      </div>

    </div>
